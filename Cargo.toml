[package]
name = "buaa"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
# buaa_api = { git = "https://github.com/fontlos/buaa-api", rev = "1d64194"}
# buaa_api = { path = "../buaa-api" }
buaa_api = { git = "https://github.com/Cheuring/buaa-api.git", rev = "0fad52f5aa6d95b07eeb5189f679b68056a74475" }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3.4"
reqwest = { version = "0.13", features = ["json"] }
rpassword = "7.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tabled = "0.22.0"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
